name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install the built package in a throwaway project and run it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          git init -q && npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/shepherd-*.tgz
          set +e
          out=$(npx shepherd --help)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 2
          echo "$out" | grep -q "shepherd runs work through the SDD process"
      - name: Serve the dashboard from the installed package
        working-directory: ${{ runner.temp }}/app
        run: |
          # GitHub reads fail in the throwaway project, but the page and its assets are served regardless.
          npx shepherd dashboard --no-open --port 4477 > dashboard.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat dashboard.log' EXIT
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4477/ && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4477/ | tee page.html | grep -q '/assets/app.js'
          grep -qi '<html' page.html
          check() {
            ctype=$(curl -sf -o body -w '%{content_type}' "http://127.0.0.1:4477/assets/$1")
            echo "$1: $ctype, $(wc -c < body) bytes"
            echo "$ctype" | grep -q "$2"
            test -s body
          }
          check app.js javascript
          check app.css text/css
