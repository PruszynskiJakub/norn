<!doctype html>
<!--
  PROTOTYPE — throwaway. Not production code. Do not import, do not ship.

  Question: what should `shepherd dashboard` (spec.md in this folder) look like?

  Round 1 (settled): three layouts — A board + feed, B three-pane inbox, C ops table + log.
  Verdict: B. A and C are dropped from this file.

  Round 2 (this file): the developer wants to read the agents' remarks — the notes that
  implement, review and QA leave with their outcome — to see what kind of remarks agents raise.
  Three variants of B that place those remarks differently, switchable via `?variant=B1|B2|B3`
  and the floating bar (← / → keys also cycle):
    B1  Inline        — remarks sit in the timeline under their event, collapsed to a few lines.
    B2  Remarks tab   — a second centre tab that is a reading view of remarks only, with filters.
    B3  Rounds thread — the right pane shows the selected item's remarks as a round-by-round
                        conversation (implement → review → fix → review → QA), like a PR thread.

  Spec impact if adopted: the outcome FeedEvent carries the outcome's note (the comment body,
  markdown) and the implement step's "done" becomes an outcome event too. The port method
  already reads comments; it now returns their bodies for shepherd outcome comments.

  QA remarks and QA-evidence events link to the issue's evidence branch `shepherd/qa/<n>` at the
  commit shepherd pushed (src/tidy.ts qaBranch, `shepherd done --evidence`), and to each file there.
  Spec impact: outcome and qa-evidence events carry `evidence: { branch, sha, files }`.

  Round 3: "looks good but too dense, nothing steers the eye". Same three variants, calmer:
    - one focal point: a hero that says how many things need you, each as a card with its drive command;
      "worth a look" below it for quiet agents and items one round from the fix limit
    - colour only means attention (orange = needs you, amber = stuck/failed); everything else neutral
    - significant events read as sentences; runs of routine ones (claims, steps, slices) fold into one line
    - fewer badges, more whitespace, a 720px reading column; right pane speaks in sentences

  The bar also flips page states (loaded / initial loading / poll error with stale data);
  ◐ toggles the theme. Open by double-clicking. No build, no network, no persistence.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>shepherd dashboard prototype</title>
<style>

  :root {

    --border: #232327; --accent: #7aa7ff; --accent-bg: #16213a;
    --ok: #6ccf8e; --ok-bg: #0f2017; --warn: #f0b860; --warn-bg: #2a2010;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mono { font-family: var(--mono); font-size: 0.85em; }
  .muted { color: var(--muted); }

  .small { font-size: 13px; }
  .quiet { border: 0; background: none; padding: 4px 8px; border-radius: 8px; color: var(--muted); font-size: 13px; }
  .quiet:hover { background: var(--muted-bg); color: var(--fg); }
  .linkbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 13px; }
  .linkbtn:hover { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

  .pips.full i.on { background: var(--bad); }
  .cmd { font-family: var(--mono); font-size: 12.5px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px 10px; display: inline-flex; gap: 8px; align-items: center; color: var(--soft); }
  .cmd button { border: 0; background: none; padding: 0; color: var(--faint); font-size: 12px; font-family: var(--sans); }
  .cmd button:hover { color: var(--fg); }
  .skeleton { background: linear-gradient(90deg, var(--muted-bg), var(--border), var(--muted-bg)); background-size: 200% 100%;
    animation: sk 1.4s infinite linear; border-radius: 10px; }
  @keyframes sk { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  .spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--muted); border-radius: 50%;

  @keyframes rot { to { transform: rotate(360deg) } }
  .stale-data { opacity: .55; }
  .notice { color: var(--warn); font-size: 13px; margin: -4px 0 20px; }

  /* remark markdown */
  .md { font-size: 14px; line-height: 1.65; color: var(--soft); }
  .md p { margin: 0 0 8px; }
  .md ul, .md ol { margin: 2px 0 8px; padding-left: 20px; }
  .md li { margin: 3px 0; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--muted-bg); padding: 1px 5px; border-radius: 5px; }
  .md pre { font-family: var(--mono); font-size: 12.5px; background: var(--muted-bg); padding: 10px 12px; border-radius: 10px; overflow-x: auto; margin: 6px 0 10px; }

  .md b { color: var(--fg); font-weight: 600; }
  .md > :last-child { margin-bottom: 0; }

  .remark.warn, .remark.bad { box-shadow: inset 3px 0 0 var(--warn); }
  .clamp { max-height: 5.2em; overflow: hidden; position: relative; }
  .clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2em; background: linear-gradient(transparent, var(--muted-bg)); }
  .card .clamp::after { background: linear-gradient(transparent, var(--card)); }

  /* QA evidence branch */

  /* floating prototype switcher — deliberately NOT part of the design */
  #proto-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;

    background: #111; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,.35); font: 13px var(--sans);

  #proto-bar button.on { background: #f0abfc; color: #111; }
  #proto-bar .lbl { padding: 0 8px; min-width: 190px; text-align: center; font-weight: 600; }
  #proto-bar .sep { width: 1px; height: 18px; background: #404040; margin: 0 2px; }

  .B main { padding: 28px 40px 120px; }
  .B .col { max-width: 720px; margin: 0 auto; }
  .B section.detail { padding: 28px 24px 110px; border-left: 1px solid var(--border); background: var(--card); }

  .grp { padding: 18px 10px 6px; font-size: 12px; color: var(--faint); }

  .d.warn { background: var(--warn); }
  .d.bad { background: var(--bad); }

  .ev .s .att.bad { background: var(--bad); }
  .ev .s .att.ok { background: var(--ok); }

  .ev .where { color: var(--muted); }
  .ev .who { font-size: 13px; color: var(--faint); margin-top: 1px; }
  .ev .who a { color: var(--faint); }

  .ev.routine { padding: 3px 0; }

  .sechead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }

  /* remark cards (B2) */

  /* right pane */

  .pipeline { display: flex; gap: 3px; margin: 0 0 6px; }

  .pipeline span.done { background: var(--ok); }

  .pipelabels { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); margin-bottom: 22px; }
  .facts { list-style: none; padding: 0; margin: 0 0 22px; }
  .facts li { padding: 9px 0; border-top: 1px solid var(--border); font-size: 14px; color: var(--soft); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .facts li:last-child { border-bottom: 1px solid var(--border); }
  .yours { background: var(--warn-bg); border-radius: 12px; padding: 14px 16px; margin: 0 0 22px; }
  .yours b { font-weight: 500; color: var(--warn); display: block; margin-bottom: 2px; font-size: 14px; }

  .prog { margin-bottom: 18px; cursor: pointer; }
  .prog .pt { font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
  .prog .pt span:last-child { color: var(--faint); font-size: 13px; white-space: nowrap; }
  .bar { height: 4px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); border-radius: 2px; }

  /* B3 thread */
  .round { margin: 26px 0 12px; font-size: 13px; color: var(--faint); display: flex; align-items: center; gap: 10px; }
  .round::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .msg { margin-bottom: 16px; }
  .msg .mh { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; font-size: 14px; }
  .msg .mh b { font-weight: 500; }
  .msg .mh .warn { color: var(--warn); }
  .msg .bubble { background: var(--muted-bg); border-radius: 12px; padding: 12px 14px; }
  .msg.warn .bubble { box-shadow: inset 3px 0 0 var(--warn); }

  @media (max-width: 1000px) {
    .B, .B.wide { grid-template-columns: 1fr; height: auto; }
    .B aside, .B section.detail { border: 0; }
    .B main { padding: 20px 16px 120px; }
  }
</style>
</head>

        ${centre(remarkMode)}</div>`}
    </div></main>
    <section class="detail">${loading ? sk(6, 30) : remarkMode === "B3" ? (sel ? threadB3(sel) : latestB3()) : sel ? detail(sel) : progress()}</section>
  </div>`;
}

function sidebar(loading) {
  const waiting = STATE.waitingForMe.length;
  const open = STATE.board.filter((s) => s.state !== "closed");
  const closed = STATE.board.filter((s) => s.state === "closed");
  return `<div class="brand"><b>shepherd</b><span>${REPO}</span></div>
    <div class="nav ${ui.selected == null ? "sel" : ""}" onclick="select(null)"><span class="t">Overview</span>${waiting ? `<span class="count">${waiting}</span>` : ""}</div>
    ${loading ? sk(8, 22) : `
    <div class="grp">Your stories</div>
    ${open.map((s) => `
      <div class="nav story ${ui.selected === s.number ? "sel" : ""}" onclick="select(${s.number})"><span class="t">${esc(s.title)}</span>${flag(s)}</div>
      ${s.slices.map((x) => `<div class="nav child ${ui.selected === x.number ? "sel" : ""}" onclick="select(${x.number})">
        <span class="d ${dotClass(x)}"></span><span class="t">${esc(x.title)}</span>${flag(x)}</div>`).join("")}`).join("")}
    ${closed.length ? `<div class="grp">Closed this week</div>${closed.map((s) => `<div class="nav child ${ui.selected === s.number ? "sel" : ""}" onclick="select(${s.number})"><span class="d done"></span><span class="t">${esc(s.title)}</span></div>`).join("")}` : ""}`}`;
}

/* The one thing the page wants you to read first. */
function hero() {
  const w = STATE.waitingForMe;
  const items = allItems().filter((i) => !i.isStory && i.state !== "merged");
  const working = items.filter((i) => i.holder && !i.holder.stale).length;
  const quiet = items.filter((i) => i.holder?.stale);
  const close = items.filter((i) => !i.needsHuman && i.fixRounds > 0 && i.fixRounds === i.maxFixRounds - 1);
  const n = ["Nothing", "One thing", "Two things", "Three things", "Four things"][w.length] ?? `${w.length} things`;
  return `<div class="hero">
    <h1>${n} ${w.length === 1 ? "needs" : "need"} you${w.length ? "" : " right now"}</h1>
    <p class="sub">${working} agent${working === 1 ? " is" : "s are"} working${quiet.length ? `, ${quiet.length} went quiet` : ""}.</p>
    ${w.map((x) => {
      const escalated = x.kind === "needs-human";
      return `<div class="need ${escalated ? "bad" : "warn"}" onclick="select(${x.number})">
        <div class="nt">${esc(x.title)}</div>
        <div class="nr">${escalated ? esc(x.reason.replace(/^fix rounds exhausted \(\d\/\d\); /, "")) : x.number === x.story ? "Every slice merged and agent QA passed. Your QA closes the story." : "Agent QA passed. A few checks need a person."}</div>
        <div class="na"><span class="kind">${escalated ? "Escalated" : "Your QA"} · ${ago(x.since)}</span>${copy(x.command)}</div>
      </div>`; }).join("")}
    ${quiet.length || close.length ? `<div class="look"><h3>Worth a look</h3>
      ${quiet.map((x) => `<div class="row" onclick="select(${x.number})"><span class="d warn" style="align-self:center"></span><span class="t">${esc(x.title)}</span><span class="faint small">agent ${x.holder.session} quiet for ${quietFor(x.holder)}</span></div>`).join("")}
      ${close.map((x) => `<div class="row" onclick="select(${x.number})"><span class="d" style="align-self:center;background:var(--faint)"></span><span class="t">${esc(x.title)}</span><span class="faint small">${x.fixRounds} of ${x.maxFixRounds} fix rounds used</span></div>`).join("")}
    </div>` : ""}
  </div>`;
}

function centre(mode) {
  const feed = feedFor(ui.selected);
  const title = ui.selected ? "History" : "What happened";
  if (mode === "B1") {
    const evs = ui.onlyRemarks ? feed.filter((e) => e.note && (ui.step === "all" || stepGroup(e) === ui.step)) : feed;
    return `<div class="sechead"><h3 class="sec">${title}</h3>
      ${ui.onlyRemarks ? stepSeg() : ""}
      <div class="seg"><button class="${ui.onlyRemarks ? "" : "on"}" onclick="ui.onlyRemarks=false;render()">Everything</button><button class="${ui.onlyRemarks ? "on" : ""}" onclick="ui.onlyRemarks=true;render()">Remarks</button></div></div>
      ${timeline(evs, (e) => e.note ? inlineRemark(e) : "")}`;
  }
  if (mode === "B2") {
    return `<div class="sechead"><h3 class="sec">${title}</h3>
      ${ui.tab === "remarks" ? stepSeg() : ""}
      <div class="seg"><button class="${ui.tab === "activity" ? "on" : ""}" onclick="ui.tab='activity';render()">Activity</button><button class="${ui.tab === "remarks" ? "on" : ""}" onclick="ui.tab='remarks';render()">Remarks</button></div></div>
      ${ui.tab === "activity"
        ? timeline(feed, (e) => e.note ? `<button class="linkbtn" style="margin-top:4px" onclick="ui.tab='remarks';render()">Read the remark →</button>` : "")
        : remarksB2(feed)}`;
  }
  return `<div class="sechead"><h3 class="sec">${title}</h3></div>
    ${timeline(feed, (e) => e.note && ui.selected !== e.issue ? `<button class="linkbtn" style="margin-top:4px" onclick="ui.selected=${e.issue};render()">Read the thread →</button>` : "")}`;
}
function stepSeg() {
  return `<div class="seg">${["all", "implement", "review", "qa"].map((k) =>
    `<button class="${ui.step === k ? "on" : ""}" onclick="ui.step='${k}';render()">${{ all: "All", implement: "Implement", review: "Review", qa: "QA" }[k]}</button>`).join("")}</div>`;
}

/* Significant events read as sentences; runs of routine ones fold into one quiet line. */
function timeline(feed, extra) {
  if (!feed.length) return `<p class="muted">Nothing here yet.</p>`;
  const days = {};
  for (const e of feed) { const d = new Date(e.at); const k = d.getUTCDate() === new Date(NOW).getUTCDate() ? "Today" : d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" }); (days[k] ??= []).push(e); }
  return Object.entries(days).map(([day, evs]) => {
    const chunks = [];
    for (const e of evs) {
      const last = chunks[chunks.length - 1];
      if (isRoutine(e) && last?.routine) last.evs.push(e); else chunks.push({ routine: isRoutine(e), evs: [e] });
    }
    return `<div class="day">${day}</div>${chunks.map((c) => c.routine ? routineChunk(c.evs) : significant(c.evs[0], extra)).join("")}`;
  }).join("");
}
function significant(e, extra) {
  return `<div class="ev"><span class="tm">${hhmm(e.at)}</span><div>
    <div class="s"><span class="att ${attention(e)}"></span>${esc(say(e))}${roundNote(e)}${where(e)}</div>
    <div class="who">${who(e)} · <a href="${e.url}" target="_blank">GitHub ↗</a></div>
    ${extra(e)}</div></div>`;
}
function routineChunk(evs) {
  const id = evs[0].url + evs[0].at + evs.length;
  if (!ui.expanded.has(id)) return `<div class="ev routine"><span class="tm">${hhmm(evs[0].at)}</span><div>
    <button class="routine-toggle" onclick="toggle(ui.expanded,'${id}')">${evs.length === 1 ? esc(eventText(evs[0])) + where(evs[0]) : `${evs.length} routine updates`} <span>›</span></button></div></div>`;
  return evs.map((e, i) => `<div class="ev routine"><span class="tm">${hhmm(e.at)}</span><div class="s">${esc(eventText(e))}${where(e)} <span class="faint">· ${who(e)}</span>
    ${i === 0 && evs.length > 1 ? `<button class="routine-toggle" onclick="toggle(ui.expanded,'${id}')">hide</button>` : ""}
    ${e.kind === "qa-evidence" ? `<br>${evidenceBlock(e.evidence, true)}` : ""}</div></div>`).join("");
}

/* ---- B1: remark inline, clamped ---- */
function inlineRemark(e) {
  const open = ui.open.has(e.url);
  return `<div class="remark ${attention(e)}"><div class="${open ? "" : "clamp"}">${md(e.note)}</div>
    <button class="linkbtn" style="margin-top:6px" onclick="toggleOpen('${e.url}')">${open ? "Show less" : "Show the whole remark"}</button>
    ${open ? evidenceBlock(e.evidence) : evidenceBlock(e.evidence, true)}</div>`;
}

/* ---- B2: remarks as a reading view ---- */
function remarksB2(feed) {
  const evs = feed.filter((e) => e.note && (ui.step === "all" || stepGroup(e) === ui.step));
  return evs.map((e) => `<div class="rcard">
      <div class="rh"><span class="att ${attention(e)}" style="display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;vertical-align:1px;background:var(--${{ warn: "warn", bad: "bad", ok: "ok" }[attention(e)] ?? "border"})"></span>${esc(say(e))}${roundNote(e)}</div>
      <div class="rt">${ui.selected === e.issue ? "" : `<a href="#" onclick="select(${e.issue});return false">${esc(itemByNumber(e.issue)?.title ?? "")}</a> · `}${who(e)} · ${ago(e.at)} · <a href="${e.url}" target="_blank">GitHub ↗</a></div>
      ${noteBody(e)}
    </div>`).join("") || `<p class="muted">No remarks here.</p>`;
}

/* ---- B3: round-by-round thread in the right pane ---- */
function threadB3(x) {
  const evs = STATE.feed.filter((e) => e.note && (x.isStory ? e.story === x.number : e.issue === x.number)).slice().reverse();
  let round = -1;
  const body = evs.map((e) => {
    const r = e.step === "implement" ? (e.fixRound ?? 0) : null;
    let head = "";
    if (r != null && r !== round) { round = r; head = `<div class="round">${r === 0 ? "First implementation" : `Fix round ${r} of ${e.maxFixRounds}`}</div>`; }
    else if (r == null && e.step !== "review" && round !== "qa") { round = "qa"; head = `<div class="round">QA</div>`; }
    const att = attention(e);
    return `${head}<div class="msg ${att}"><div class="mh"><b class="${att === "warn" ? "warn" : ""}">${esc(say(e))}</b><span class="faint small">${who(e)} · ${hhmm(e.at)}</span>
      <a class="faint small" style="margin-left:auto" href="${e.url}" target="_blank">↗</a></div>
      <div class="bubble">${noteBody(e)}</div></div>`;
  }).join("");
  return `${head(x)}${body || `<p class="muted small">No remarks yet. Implement, review and QA notes appear here round by round.</p>`}`;
}
function latestB3() {
  return `<div class="kicker">Latest remarks</div><p class="small muted" style="margin:4px 0 18px">Pick a story or slice to read its rounds as a thread.</p>
    ${remarks().slice(0, 5).map((e) => `<div class="msg ${attention(e)}" style="cursor:pointer" onclick="select(${e.issue})">
      <div class="mh"><b class="${attention(e) === "warn" ? "warn" : ""}">${esc(say(e))}</b><span class="faint small">${ago(e.at)}</span></div>
      <div class="faint small" style="margin:-4px 0 6px">${esc(itemByNumber(e.issue)?.title ?? "")}</div>
      <div class="bubble"><div class="clamp">${md(e.note)}</div></div></div>`).join("")}`;
}

/* ---- right pane: selected item, in sentences ---- */
function head(x) {
  const w = STATE.waitingForMe.find((w) => w.number === x.number);
  const parent = !x.isStory && STATE.board.find((s) => s.number === x.story);
  return `<div class="kicker">${x.isStory ? "Story" : `Slice of <a href="#" onclick="select(${x.story});return false">${esc(parent.title)}</a>`}</div>
    <h3>${esc(x.title)}</h3>
    <p class="status">${HUMAN_STATE[x.state] ?? x.state}${x.holder ? x.holder.stale ? `. Agent ${x.holder.session} went quiet ${quietFor(x.holder)} ago.` : `. Agent ${x.holder.session} on it for ${quietFor(x.holder)}.` : "."}</p>
    ${w ? `<div class="yours"><b>${w.kind === "needs-human" ? "Escalated to you" : "Waiting for your QA"}</b><p>${esc(w.reason)}</p>${copy(w.command)}</div>` : ""}`;
}
function detail(x) {
  const stops = ["ready-for-agent", "implementation", "needs-review", "needs-qa", "merge-queue"];
  const at = x.state === "merged" ? 9 : ["changes-requested", "qa-failed"].includes(x.state) ? 1 : x.state === "needs-human-qa" ? 3 : stops.indexOf(x.state);
  const ev = STATE.feed.find((e) => e.evidence && e.issue === x.number)?.evidence;
  return `${head(x)}
    ${x.isStory || x.state === "blocked" ? "" : `<div class="pipeline">${stops.map((s, i) => `<span class="${i < at ? "done" : i === at ? "cur" : ""}"></span>`).join("")}</div>
      <div class="pipelabels"><span>build</span><span>review</span><span>QA</span><span>merge</span></div>`}
    <ul class="facts">
      ${x.blockedBy?.length ? `<li>Waits for ${x.blockedBy.map((b) => `<a href="#" onclick="select(${b});return false">${esc(itemByNumber(b).title)}</a>`).join(" and ")}</li>` : ""}
      ${x.isStory ? "" : `<li>${pips2(x)} ${x.fixRounds ? `${x.fixRounds} of ${x.maxFixRounds} fix rounds used` : "No fix rounds yet"}</li>`}
      ${x.mode === "hil" ? `<li>You QA this one before it merges</li>` : ""}
      ${x.isStory ? `<li>${x.slices.filter((s) => s.state === "merged").length} of ${x.slices.length} slices merged</li><li><span class="mono muted">${esc(x.branch)}</span></li>` : ""}
    </ul>
    ${ev ? `<div class="kicker" style="margin-bottom:-4px">Latest QA evidence</div>${evidenceBlock(ev)}` : ""}
    <p style="margin-top:22px"><a class="small muted" href="${gh(x.number)}" target="_blank">Open on GitHub ↗</a></p>`;
}
function progress() {
  const open = STATE.board.filter((s) => s.state !== "closed");
  return `<div class="kicker" style="margin-bottom:16px">Progress</div>
    ${open.map((s) => { const m = s.slices.filter((x) => x.state === "merged").length; return `<div class="prog" onclick="select(${s.number})">
      <div class="pt"><span>${esc(s.title)}</span><span>${m} of ${s.slices.length}</span></div>
      <div class="bar"><i style="width:${(m / s.slices.length) * 100}%"></i></div></div>`; }).join("")}`;
}

/* ------------------------------------------------------------------ *
 *  Switcher (prototype chrome)                                       *
 * ------------------------------------------------------------------ */
const VARIANTS = [
  { key: "B1", name: "Remarks inline", render: () => VariantB("B1") },
  { key: "B2", name: "Remarks tab", render: () => VariantB("B2") },
  { key: "B3", name: "Rounds thread", render: () => VariantB("B3") },
];
const params = new URLSearchParams(location.search);
let current = VARIANTS.findIndex((v) => v.key === params.get("variant"));
if (current < 0) current = 0;
ui.pageState = ["loaded", "loading", "error"].includes(params.get("state")) ? params.get("state") : "loaded";

function setUrl() {
  const p = new URLSearchParams(location.search);
  p.set("variant", VARIANTS[current].key);
  ui.pageState === "loaded" ? p.delete("state") : p.set("state", ui.pageState);
  try { history.replaceState(null, "", "?" + p.toString()); } catch {}
}
function go(d) { current = (current + d + VARIANTS.length) % VARIANTS.length; setUrl(); render(); }
function setPageState(s) { ui.pageState = s; STATE.lastError = s === "error" ? ERR : null; setUrl(); render(); }
function themeBtn() { return `<button class="quiet" onclick="toggleTheme()" title="light / dark">◐</button>`; }
function toggleTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
}

function render() {
  const v = VARIANTS[current];
  document.getElementById("app").innerHTML = v.render();
  document.getElementById("proto-bar").innerHTML = `
    <span class="tag">PROTOTYPE</span>
    <button onclick="go(-1)" aria-label="previous variant">←</button>
    <span class="lbl">${v.key} (${v.name})</span>
    <button onclick="go(1)" aria-label="next variant">→</button>
    <span class="sep"></span>
    ${["loaded", "loading", "error"].map((s) => `<button class="${ui.pageState === s ? "on" : ""}" onclick="setPageState('${s}')">${s}</button>`).join("")}`;
}
addEventListener("keydown", (e) => {
  if (e.target.closest?.("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
setUrl();
render();
</script>
</body>
</html>
